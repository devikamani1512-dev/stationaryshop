
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Address | Supplyhive</title>

    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">

    <style>
        .edit-address-page {
            max-width: 760px;
            width: calc(100% - 32px);
            margin: 45px auto;
        }

        .edit-address-card {
            background: #fff;
            padding: 32px;
            border: 1px solid #e2eaf5;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 26, 77, 0.07);
        }

        .edit-address-card h1 {
            color: #001a4d;
            font-size: 30px;
            margin: 0 0 10px;
        }

        .edit-address-card .subtitle {
            color: #748198;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .address-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #001a4d;
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #d7e0ee;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #001a4d;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2463eb;
            box-shadow: 0 0 0 3px rgba(36, 99, 235, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            grid-column: 1 / -1;
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .save-address-btn,
        .cancel-address-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .save-address-btn {
            border: none;
            background: #2463eb;
            color: white;
        }

        .save-address-btn:hover {
            background: #174fc4;
        }

        .cancel-address-btn {
            background: #edf3ff;
            color: #2463eb;
        }

        @media (max-width: 600px) {
            .edit-address-page {
                margin: 25px auto;
            }

            .edit-address-card {
                padding: 22px 18px;
            }

            .edit-address-card h1 {
                font-size: 25px;
            }

            .address-form {
                grid-template-columns: 1fr;
            }

            .form-group.full-width,
            .form-actions {
                grid-column: 1;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header class="site-header">
    <div class="logo">
        <img src="{% static 'shop/images/supplyhive_logo.png' }}"
             alt="Supplyhive Logo">
        <span>Supplyhive</span>
    </div>

    <nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'shop_page' %}">Shop</a>
        <a href="{% url 'about' %}">About us</a>
        <a href="{% url 'contact' %}">Contact</a>
    </nav>
</header>

<main class="edit-address-page">
    <section class="edit-address-card">

        <h1>Edit Address</h1>
        <p class="subtitle">
            Update your delivery details below.
        </p>

        <form method="POST" class="address-form">
            {% csrf_token %}

            <div class="form-group full-width">
                <label for="full_name">Full Name</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    value="{{ address.full_name }}"
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value="{{ address.phone }}"
                    pattern="[0-9]{10,15}"
                    title="Enter a valid phone number with 10 to 15 digits"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ address.email }}"
                    maxlength="254"
                    required
                >
            </div>

            <div class="form-group full-width">
                <label for="address">Full Address</label>
                <textarea
                    id="address"
                    name="address"
                    maxlength="2000"
                    required
                >{{ address.address }}</textarea>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input
                    type="text"
                    id="city"
                    name="city"
                    value="{{ address.city }}"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="state">State</label>
                <input
                    type="text"
                    id="state"
                    name="state"
                    value="{{ address.state }}"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="pincode">PIN Code</label>
                <input
                    type="text"
                    id="pincode"
                    name="pincode"
                    value="{{ address.pincode }}"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    title="Enter a valid 6-digit PIN code"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="save-address-btn">
                    Save Changes
                </button>

                <a href="{% url 'my_addresses' %}"
                   class="cancel-address-btn">
                    Cancel
                </a>
            </div>
        </form>

    </section>
</main>

</body>
</html>
