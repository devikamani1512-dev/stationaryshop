
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Supplyhive</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
</head>
<body>

<header class="site-header">
    <div class="logo">
        <img src="{% static 'shop/images/supplyhive_logo.png' %}"
             alt="Supplyhive Logo">
        <span>Supplyhive</span>
    </div>

    <nav class="navbar">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'shop_page' %}">Shop</a>
        <a href="{% url 'about' %}">About us</a>
        <a href="{% url 'contact' %}">Contact</a>
    </nav>
</header>

<main style="max-width: 850px; margin: 45px auto; padding: 24px;">
    <h1 style="color: #001a4d;">My Account</h1>
    <p>Welcome, {{ request.user.username }}!</p>

    <section style="background: #f5f9ff; padding: 24px; border-radius: 12px;">
        <h2>Account Details</h2>
        <p><strong>Username:</strong> {{ request.user.username }}</p>
        <p><strong>Email:</strong> {{ request.user.email|default:"Not provided" }}</p>

        <hr>

        <p>
            <a href="{% url 'my_orders' %}">My Orders</a>
        </p>
        <p>
            <a href="{% url 'my_addresses' %}">My Addresses</a>
        </p>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Logout</button>
        </form>
    </section>
</main>

</body>
</html>
